<h2 id="%E5%89%8D%E5%9B%9E%E3%81%AE%E3%81%8A%E3%81%95%E3%82%89%E3%81%84">前回のおさらい</h2>
<h3 id="%E3%83%AB%E3%83%BC%E3%83%97%E5%87%A6%E7%90%86-for-%E6%96%87">ループ処理（ <code>for</code> 文 ）</h3>
<p>同じ処理を一定の回数分だけ<strong>繰り返し</strong>実行させたい場合は <code>for</code> 文を使う。<br />
例えば以下のコードでは <code>alert</code> 関数が <em>5</em> 回繰り返し実行される。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">5</span>; i++) {
  <span class="hljs-title function_">alert</span>(i + <span class="hljs-string">&#x27;回目&#x27;</span>); <span class="hljs-comment">// &#x27;0回目&#x27;, &#x27;1回目&#x27;, &#x27;2回目&#x27; ...</span>
}
</code></pre>
<p>変数 <code>i</code> は<em>ループカウンター</em>と呼び、<strong><code>{ }</code> 内が実行される度に <code>+1</code></strong> される。<br />
そして、<code>i</code> が <code>5</code> になると <code>for</code> 文は終了する。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" lang="ja" data-marpit-pagination="3" style="--paginate:true;" data-marpit-pagination-total="72">
<h3 id="for-%E6%96%87%E3%81%AE%E5%8B%95%E4%BD%9C%E5%8E%9F%E7%90%86"><code>for</code> 文の動作原理</h3>
<p>以下は 100 回ループする <code>for</code> 文の例だ。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">100</span>; i++) {
  <span class="hljs-comment">// 繰り返し</span>
}
</code></pre>
<p><code>for</code> に続く <code>( )</code> 内は、<code>;</code> を挟んだ <strong>3 つのパーツ</strong>に分けられる。</p>
<div class="cols gap">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> i = <span class="hljs-number">0</span>
</code></pre>
<ol>
<li><span class="red">左のパート</span></li>
</ol>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">i &lt; <span class="hljs-number">100</span>
</code></pre>
<ol start="2">
<li><span class="green">中央パート</span></li>
</ol>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">i++
</code></pre>
<ol start="3">
<li><span class="blue">右のパート</span></li>
</ol>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" lang="ja" data-marpit-pagination="4" style="--paginate:true;" data-marpit-pagination-total="72">
<table>
<thead>
<tr>
<th style="text-align:center">実行順</th>
<th style="text-align:left">実行コード</th>
<th style="text-align:left">実行内容</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center">1.</td>
<td style="text-align:left"><code>for</code></td>
<td style="text-align:left">ループ制御開始</td>
</tr>
<tr>
<td style="text-align:center">2.</td>
<td style="text-align:left"><code class="red">let i = 0</code></td>
<td style="text-align:left"><small class="red">左のパート:</small> ループカウンタの宣言</td>
</tr>
<tr>
<td style="text-align:center">3.</td>
<td style="text-align:left"><code class="green">i &lt; 100</code></td>
<td style="text-align:left"><small class="green">中央パート:</small> 条件判定（条件に合致しなければここで <code>for</code> 文を終了する）</td>
</tr>
<tr>
<td style="text-align:center">4.</td>
<td style="text-align:left"><code>{ ... }</code></td>
<td style="text-align:left"><code>{ }</code> 内の処理の実行</td>
</tr>
<tr>
<td style="text-align:center">5.</td>
<td style="text-align:left"><code class="blue">i++</code></td>
<td style="text-align:left"><small class="blue">右のパート:</small> ループカウンタに +1</td>
</tr>
<tr>
<td style="text-align:center">6.</td>
<td style="text-align:left">-</td>
<td style="text-align:left">3. に戻る</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">100</span>; i++) {
  <span class="hljs-comment">// 繰り返し</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" lang="ja" data-marpit-pagination="5" style="--paginate:true;" data-marpit-pagination-total="72">
<h1 id="%E3%82%AA%E3%83%96%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88-object">オブジェクト (Object)</h1>
<p>プロパティで表現される、バーチャルな “モノ”</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" lang="ja" data-marpit-pagination="6" style="--paginate:true;--marpit-advanced-background-split:35%;" data-marpit-pagination-total="72" data-marpit-advanced-background="background" data-marpit-advanced-background-split="left"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;assets/apple.png&quot;);background-size:75%;"></figure></div></section></foreignObject><foreignObject width="65%" height="720" x="35%"><section id="6" data-paginate="true" lang="ja" data-marpit-pagination="6" style="--paginate:true;--marpit-advanced-background-split:35%;" data-marpit-pagination-total="72" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<p><em>「物」は単一の数値では表現できない。</em><br />
どんなに単純な物体でも<br />
色, 形, 大きさ, 重さ<br />
といった、<em>多面的な情報の集合</em>から成り立っている。</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" lang="ja" data-marpit-pagination="6" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="left"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" lang="ja" data-marpit-pagination="7" style="--paginate:true;" data-marpit-pagination-total="72">
<p>そのような「物」を JavaScript で表現するには<br />
<strong>オブジェクト (Object)</strong> というデータ型を用いるのがよい。</p>
<p><em>データ型</em>とは、数値や文字列といった値のタイプ（種類）のことだ。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" lang="ja" data-marpit-pagination="8" style="--paginate:true;" data-marpit-pagination-total="72">
<p>オブジェクトは通常、<strong>1つ以上の属性（プロパティ）</strong> から構成されており、<br />
このような書式で定義することができる。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">{
  プロパティ<span class="hljs-attr">A</span>: 値,
  プロパティ<span class="hljs-attr">B</span>: 値,
  プロパティ<span class="hljs-attr">C</span>: 値,
}
</code></pre>
<p>プロパティ名は自由だ。<small>（ただし半角英数を推奨）</small></p>
<p><em>値の後に <code>,（カンマ）</code></em> を付けることを忘れてはならない。<br />
<em>最後のプロパティ</em>の値に限り <code>,</code> を付けて付けなくてもどちらでも良いのだが、<br />
「<strong>値の後は必ず <code>,</code> を付ける</strong>」と覚えた方が付け忘れが起きにくいだろう。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" lang="ja" data-marpit-pagination="9" style="--paginate:true;" data-marpit-pagination-total="72">
<p>例として一個の <img class="emoji" draggable="false" alt="🍎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f34e.svg" data-marp-twemoji=""/> 林檎をオブジェクトとして表してみよう。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">{
  <span class="hljs-attr">color</span>:  <span class="hljs-string">&#x27;red&#x27;</span>, <span class="hljs-comment">// 色</span>
  <span class="hljs-attr">size</span>:   <span class="hljs-number">11</span>,    <span class="hljs-comment">// 大きさ (cm)</span>
  <span class="hljs-attr">weight</span>: <span class="hljs-number">400</span>,   <span class="hljs-comment">// 重さ (g)</span>
}
</code></pre>
<p>このオブジェクトは <code>color</code>, <code>size</code>, <code>weight</code> という 3 つのプロパティで構成されている。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" lang="ja" data-marpit-pagination="10" style="--paginate:true;" data-marpit-pagination-total="72">
<p>オブジェクトはデータ型の一つなので、<br />
数値や文字列と同様、<strong>変数に代入</strong>することが可能だ。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> apple = {
  <span class="hljs-attr">color</span>:  <span class="hljs-string">&#x27;red&#x27;</span>, <span class="hljs-comment">// 色</span>
  <span class="hljs-attr">size</span>:   <span class="hljs-number">11</span>,    <span class="hljs-comment">// 大きさ (cm)</span>
  <span class="hljs-attr">weight</span>: <span class="hljs-number">400</span>,   <span class="hljs-comment">// 重さ (g)</span>
};
</code></pre>
<p>先ほどの <img class="emoji" draggable="false" alt="🍎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f34e.svg" data-marp-twemoji=""/> 林檎オブジェクトを <code>apple</code> という変数に代入してみた。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" lang="ja" data-marpit-pagination="11" style="--paginate:true;" data-marpit-pagination-total="72">
<p>「<em>オブジェクト</em>」と「<em>プロパティ</em>」の関係性は、ゲームにおける<br />
「<strong>キャラクター</strong>」と「<strong>ステータス値</strong>」の関係性に近い。</p>
<div class="cols gap c23">
<p><img src="assets/hero.png" alt="" /></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// オブジェクト: プレイヤーキャラクター</span>
<span class="hljs-keyword">let</span> player = {
  <span class="hljs-attr">name</span>: <span class="hljs-string">&#x27;John&#x27;</span>,  <span class="hljs-comment">// 名前</span>
  <span class="hljs-attr">sex</span>:  <span class="hljs-string">&#x27;male&#x27;</span>,  <span class="hljs-comment">// 性別</span>
  <span class="hljs-attr">lv</span>:     <span class="hljs-number">30</span>,    <span class="hljs-comment">// レベル</span>
  <span class="hljs-attr">exp</span>:  <span class="hljs-number">1024</span>,    <span class="hljs-comment">// 経験値</span>
  <span class="hljs-attr">hp</span>:    <span class="hljs-number">128</span>,    <span class="hljs-comment">// 体力</span>
  <span class="hljs-attr">str</span>:    <span class="hljs-number">99</span>,    <span class="hljs-comment">// ちから</span>
  <span class="hljs-attr">agl</span>:     <span class="hljs-number">8</span>,    <span class="hljs-comment">// 素早さ</span>
  <span class="hljs-attr">fth</span>:    <span class="hljs-number">99</span>,    <span class="hljs-comment">// 信仰心</span>
};
</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" lang="ja" data-marpit-pagination="12" style="--paginate:true;" data-marpit-pagination-total="72">
<p>これまで、物体の描画位置やサイズなどの情報を表現する際、</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> x = <span class="hljs-number">10</span>;    <span class="hljs-comment">// 円の x 座標</span>
<span class="hljs-keyword">let</span> y = <span class="hljs-number">20</span>;    <span class="hljs-comment">// 円の y 座標</span>
<span class="hljs-keyword">let</span> size = <span class="hljs-number">50</span>; <span class="hljs-comment">// 円の直径</span>
</code></pre>
<p>このように<em>複数の変数</em>を使用してきたが、<br />
替わりにオブジェクトを利用することで...</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// 円オブジェクト</span>
<span class="hljs-keyword">let</span> ball = {
  <span class="hljs-attr">x</span>: <span class="hljs-number">10</span>,    <span class="hljs-comment">// x 座様</span>
  <span class="hljs-attr">y</span>: <span class="hljs-number">20</span>,    <span class="hljs-comment">// y 座標</span>
  <span class="hljs-attr">size</span>: <span class="hljs-number">50</span>, <span class="hljs-comment">// 直径</span>
};
</code></pre>
<p>このように、<strong>各情報をオブジェクトのプロパティとしてまとめる</strong>ことができる。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" lang="ja" data-marpit-pagination="13" style="--paginate:true;" data-marpit-pagination-total="72">
<p>変数に代入したオブジェクトのプロパティにアクセスするには、</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-title function_">alert</span>(<span class="hljs-string">&#x27;ようこそ！ &#x27;</span> + player.<span class="hljs-property">name</span> + <span class="hljs-string">&#x27;さん&#x27;</span>); <span class="hljs-comment">// &#x27;ようこそ！ Johnさん&#x27;</span>
</code></pre>
<p>このように、<code>変数名.プロパティ名</code> と書けばよい。<br />
それ以外のルールは <strong>変数と全く同じ</strong> なので、<br />
<em>プロパティの値を増減させたり上書きすることが可能</em> である。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">player.<span class="hljs-property">lv</span>++; <span class="hljs-comment">// レベルアップ</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> dmg = <span class="hljs-number">256</span>;
player.<span class="hljs-property">hp</span> = player.<span class="hljs-property">hp</span> - dmg; <span class="hljs-comment">// プレイヤーに 256 のダメージ</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" lang="ja" data-marpit-pagination="14" style="--paginate:true;" data-marpit-pagination-total="72">
<p>先ほどの円オブジェクトを <code>circle()</code> 関数で描画するなら、以下のように書き表わせる。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// 円オブジェクト</span>
<span class="hljs-keyword">let</span> ball = {
  <span class="hljs-attr">x</span>: <span class="hljs-number">10</span>,    <span class="hljs-comment">// x 座様</span>
  <span class="hljs-attr">y</span>: <span class="hljs-number">20</span>,    <span class="hljs-comment">// y 座標</span>
  <span class="hljs-attr">size</span>: <span class="hljs-number">50</span>, <span class="hljs-comment">// 直径</span>
};

<span class="hljs-comment">// 描画</span>
<span class="hljs-title function_">circle</span>(ball.<span class="hljs-property">x</span>, ball.<span class="hljs-property">y</span>, ball.<span class="hljs-property">size</span>);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" lang="ja" data-marpit-pagination="15" style="--paginate:true;" data-marpit-pagination-total="72">
<p>また、プロパティは <strong>後から追加</strong> しても問題ない。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> ball = {};  <span class="hljs-comment">// 空のオブジェクトを作成</span>
ball.<span class="hljs-property">x</span> = <span class="hljs-number">10</span>;    <span class="hljs-comment">// プロパティ x を追加</span>
ball.<span class="hljs-property">y</span> = <span class="hljs-number">20</span>;    <span class="hljs-comment">// プロパティ y を追加</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" lang="ja" data-marpit-pagination="16" style="--paginate:true;" data-marpit-pagination-total="72">
<p>サンプルスケッチを確認してみよう。<br />
<code>04/balls.js</code> <a href="https://editor.p5js.org/amekusa/sketches/UulZcFAl-">https://editor.p5js.org/amekusa/sketches/UulZcFAl-</a></p>
<p>改造版:<br />
<code>04/bouncy-balls.js</code> <a href="https://editor.p5js.org/amekusa/sketches/_AV0PDuJr">https://editor.p5js.org/amekusa/sketches/_AV0PDuJr</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" lang="ja" data-marpit-pagination="17" style="--paginate:true;" data-marpit-pagination-total="72">
<h1 id="%E9%85%8D%E5%88%97-array">配列 (array)</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" lang="ja" data-marpit-pagination="18" style="--paginate:true;" data-marpit-pagination-total="72">
<p>第二回目の講義で、<br />
変数は <strong>「値を一つだけ保存できる容れ物」</strong> のようなものだと説明した。</p>
<p>先ほどのサンプルスケッチ内の<strong>変数 <code>ballA</code>, <code>ballB</code></strong> のように、<br />
<strong>2 個のオブジェクトが必要なら 2 つの変数</strong>を用意する必要がある。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" lang="ja" data-marpit-pagination="19" style="--paginate:true;" data-marpit-pagination-total="72">
<p>もし同じ方法で <strong>3 個目のボール</strong>が欲しくなったら、<br />
我々はさらに <strong>変数 <code>ballC</code></strong> を用意しなくてはならない。</p>
<p>だが <em>“Don't Repeat Yourself”</em> の原則に立ち返るならば、<br />
これは美しい解決方法とは言えない。</p>
<p>そこで <strong>配列 (array)</strong> の出番となる。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" lang="ja" data-marpit-pagination="20" style="--paginate:true;" data-marpit-pagination-total="72">
<p>配列とは <em>特殊なオブジェクトの一種</em>で、<br />
<strong>複数の値を、それぞれに番号を振って格納, 管理</strong>することのできる構造体である。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" lang="ja" data-marpit-pagination="21" style="--paginate:true;" data-marpit-pagination-total="72">
<p><em>貨物列車</em> をイメージしてほしい。<br />
先頭の貨物は <code>0</code> 番で、その次は <code>1</code> 番, その次は <code>2</code> 番... という具合に、<br />
<strong>各貨物には連番が振られている。</strong></p>
<figure>
<div class="array">
  配列
  <div class="item a">0番: 値A</div>
  <div class="item b">1番: 値B</div>
  <div class="item c">2番: 値C</div>
</div>
<style scoped>
.array {
  display: flex;
  gap: 1em;
  align-items: center;
  justify-content: center;
  padding: 1em;
  /* background: hsl(40, 80%, 90%); */
  border: 1px dashed #0008;
  font-family: Menlo, Monaco, monospace;
}
.item {
  padding: .5em 1em;
}
.item.a {
  background: hsl(0, 90%, 80%);
}
.item.b {
  background: hsl(90, 90%, 80%);
}
.item.c {
  background: hsl(180, 90%, 80%);
}
</style>
<figure>
<p>そして、各貨物には一つづつ <strong>値</strong> を入れることができる。<br />
貨物はそれぞれが <strong>変数</strong> のようなものだとも言える。</p>
<p>変数との違いは、<strong>名前ではなく番号でアクセスする</strong> という点だ。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" lang="ja" data-marpit-pagination="22" style="--paginate:true;" data-marpit-pagination-total="72">
<p>配列を定義するには、</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">[値A, 値B, 値C]
</code></pre>
<p>このように <code>[ ]</code> の中に <strong><code>,（カンマ）</code> 区切り</strong>で値を列挙する。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> list = [<span class="hljs-string">&#x27;Alice&#x27;</span>, <span class="hljs-string">&#x27;Bob&#x27;</span>, <span class="hljs-string">&#x27;Charles&#x27;</span>];
</code></pre>
<p>この例では、<strong>変数 <code>list</code></strong> に<br />
<strong>三つの文字列 <code>Alice</code>, <code>Bob</code>, <code>Charles</code> が入った配列</strong> を代入している。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" lang="ja" data-marpit-pagination="23" style="--paginate:true;" data-marpit-pagination-total="72">
<p>先ほどは &quot;貨物&quot; と例えたが、<br />
配列に格納されている一つ一つの値は、正式には <strong>要素 (element)</strong> と呼び、<br />
<strong>番号を指定</strong> してそれぞれの要素にアクセスすることができる。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-title function_">alert</span>( list[<span class="hljs-number">0</span>] ); <span class="hljs-comment">// &quot;Alice&quot;</span>
<span class="hljs-title function_">alert</span>( list[<span class="hljs-number">1</span>] ); <span class="hljs-comment">// &quot;Bob&quot;</span>
<span class="hljs-title function_">alert</span>( list[<span class="hljs-number">2</span>] ); <span class="hljs-comment">// &quot;Charles&quot;</span>
</code></pre>
<p><code>[ ]</code> の数字が番号で、<strong><code>0</code> から始まる連番</strong>となっている。<br />
この番号は <strong>添字（インデックス）</strong> と呼ぶ。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" lang="ja" data-marpit-pagination="24" style="--paginate:true;" data-marpit-pagination-total="72">
<p>ちなみに、値の列挙時に改行を挟んでも問題ない。<br />
長い配列を定義する際は<em>読みやすさ</em>を心がけよう。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// NATO フォネティックコード</span>
<span class="hljs-keyword">let</span> list = [
  <span class="hljs-string">&#x27;Alfa&#x27;</span>,
  <span class="hljs-string">&#x27;Bravo&#x27;</span>,
  <span class="hljs-string">&#x27;Charlie&#x27;</span>,

  <span class="hljs-string">&#x27;Delta&#x27;</span>,
  <span class="hljs-string">&#x27;Echo&#x27;</span>,
  <span class="hljs-string">&#x27;Foxtrot&#x27;</span>,
];
</code></pre>
<p>また、<em>最後の値に限り</em> <code>,</code> を付けても付けなくてもどちらでも良い。<br />
「<strong>値の後は必ず <code>,</code> が付く</strong>」と覚えておけば付け忘れは起きにくいだろう。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" lang="ja" data-marpit-pagination="25" style="--paginate:true;" data-marpit-pagination-total="72">
<p>配列に<strong>後から要素を追加</strong>することも可能だ。<br />
<strong><code>push()</code> 関数</strong>を使うと、<strong>配列の最後尾</strong>に新しい要素を追加できる。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">list.<span class="hljs-title function_">push</span>(<span class="hljs-string">&#x27;Golf&#x27;</span>); <span class="hljs-comment">// Foxtrot の次</span>
</code></pre>
<p>また、<strong><code>length</code> プロパティ</strong> を参照することで、<br />
<em>その配列内の要素の総数</em> を知ることもできる。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-title function_">alert</span>( list.<span class="hljs-property">length</span> ); <span class="hljs-comment">// 7</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" lang="ja" data-marpit-pagination="26" style="--paginate:true;" data-marpit-pagination-total="72">
<h2 id="%E9%85%8D%E5%88%97%E3%82%92-%E3%82%B9%E3%82%AD%E3%83%A3%E3%83%B3-%E3%81%99%E3%82%8B">配列を “スキャン” する</h2>
<p><code>for</code> 文と配列の合わせ技</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" lang="ja" data-marpit-pagination="27" style="--paginate:true;" data-marpit-pagination-total="72">
<p>ここまで内容では配列の利点がこれといって思いつかないかもしれないが、<br />
<strong>添字で個々の要素にアクセスできる</strong>という性質が<br />
<strong><code>for</code> ループ</strong>と組み合わせた時にその真価を発揮する。</p>
<hr />
<p>まずはサンプルコードを確認してほしい。<br />
<code>05/array.js</code> <a href="https://editor.p5js.org/amekusa/sketches/LmP6WozgJ">https://editor.p5js.org/amekusa/sketches/LmP6WozgJ</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" lang="ja" data-marpit-pagination="28" style="--paginate:true;" data-marpit-pagination-total="72">
<p>始めに <code>keylist</code> という名の変数に、配列を作成・代入している。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// 配列を作成</span>
<span class="hljs-keyword">let</span> keylist = [
  <span class="hljs-string">&#x27;a&#x27;</span>,
  <span class="hljs-string">&#x27;b&#x27;</span>,
  <span class="hljs-string">&#x27;c&#x27;</span>,
];
</code></pre>
<p>この配列は <code>a</code>, <code>b</code>, <code>c</code>, 3 つの文字列をそれぞれ要素に持つ。<br />
要素が 3 つなので、<strong><code>keylist.length</code> プロパティの値は <code>3</code></strong> となる。</p>
<p><code>draw()</code> 関数内に要素数を表示している箇所があるので確認してほしい。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// 現在の配列内の要素数を表示</span>
<span class="hljs-title function_">text</span>(<span class="hljs-string">&#x27;要素数: &#x27;</span> + keylist.<span class="hljs-property">length</span>, <span class="hljs-number">20</span>, <span class="hljs-number">40</span>);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" lang="ja" data-marpit-pagination="29" style="--paginate:true;" data-marpit-pagination-total="72">
<p>注目してもらいたいのが、そのすぐ下にある <em><code>for</code></em> 文だ。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// 配列をスキャンする（要素の数だけループを回す）</span>
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-number">0</span>; i &lt; keylist.<span class="hljs-property">length</span>; i++) {
  <span class="hljs-keyword">let</span> x = <span class="hljs-number">20</span> + i * <span class="hljs-number">20</span>;
  <span class="hljs-keyword">let</span> y = <span class="hljs-number">200</span>;
  <span class="hljs-title function_">text</span>(keylist[i], x, y); <span class="hljs-comment">// 要素を表示</span>
}
</code></pre>
<p><em>ループ回数</em>を指定する部分に <code>keylist.length</code> が入っているので、<br />
この <code>for</code> 文は <strong><code>keylist</code> 配列の要素数分だけ実行される</strong>ということになる。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" lang="ja" data-marpit-pagination="30" style="--paginate:true;" data-marpit-pagination-total="72">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// 配列をスキャンする（要素の数だけループを回す）</span>
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-number">0</span>; i &lt; keylist.<span class="hljs-property">length</span>; i++) {
  <span class="hljs-keyword">let</span> x = <span class="hljs-number">20</span> + i * <span class="hljs-number">20</span>;
  <span class="hljs-keyword">let</span> y = <span class="hljs-number">200</span>;
  <span class="hljs-title function_">text</span>(keylist[i], x, y); <span class="hljs-comment">// 要素を表示</span>
}
</code></pre>
<p>そしてループカウンターである<em>変数 <code>i</code></em> は、<code>0</code> から始まり <code>要素数 - 1</code> まで増加するので、<br />
そのまま配列の<strong>添字</strong>として利用しているのが以下の行だ。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">  <span class="hljs-title function_">text</span>(keylist[i], x, y); <span class="hljs-comment">// 要素を表示</span>
</code></pre>
<p><em><code>keylist[i]</code></em> とすることで、<code>keylist</code> 配列内の<strong>全ての要素</strong>にアクセスしている、<br />
というのが重要な点だ。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" lang="ja" data-marpit-pagination="31" style="--paginate:true;" data-marpit-pagination-total="72">
<p>この方法は、配列内の<em>最初（0 番目）の要素</em>から、<br />
<em>最後（要素数 - 1 番目）の要素</em>まで順番に精査していくことから、<br />
<strong>配列の走査（スキャン）</strong> と呼ばれることがある。</p>
<hr />
<p>配列走査は非常に<em>出現頻度が高く</em>重要な構文なので、<br />
是非とも覚えて使いこなせるようになってほしい。<br />
<small>（プログラムコードに配列が現れたら、ほぼ確実に配列走査も行われると思ったほうがよい。）</small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" lang="ja" data-marpit-pagination="32" style="--paginate:true;" data-marpit-pagination-total="72">
<p>早速、配列と <code>for</code> ループを駆使し、<br />
2 個だったボールを <strong>24 個</strong> に増やしてみた。<br />
コードと動作を確認してみてほしい。<br />
<code>04/bouncy-balls-2.js</code> <a href="https://editor.p5js.org/amekusa/sketches/FIM3H8feO">https://editor.p5js.org/amekusa/sketches/FIM3H8feO</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" lang="ja" data-marpit-pagination="33" style="--paginate:true;" data-marpit-pagination-total="72">
<h2 id="%E6%BC%94%E7%BF%92">演習:</h2>
<p>サンプルコードを参考にしながら、</p>
<ul>
<li>オブジェクト (object)</li>
<li>配列 (array)</li>
<li><code>for</code> ループ</li>
</ul>
<p>を駆使し、<strong>動くアート</strong>を作ってみよう。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" lang="ja" data-marpit-pagination="34" style="--paginate:true;" data-marpit-pagination-total="72">
<h1 id="%E5%A4%96%E9%83%A8%E3%83%95%E3%82%A1%E3%82%A4%E3%83%AB%E3%82%92%E8%AA%AD%E3%81%BF%E8%BE%BC%E3%82%80">外部ファイルを読み込む</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" lang="ja" data-marpit-pagination="35" style="--paginate:true;" data-marpit-pagination-total="72">
<h2 id="%E7%94%BB%E5%83%8F%E3%82%92%E8%AA%AD%E3%81%BF%E8%BE%BC%E3%82%80">画像を読み込む</h2>
<p>p5.js において、画像は <strong>オブジェクト</strong> として取り扱う。<br />
<strong><code>loadImage()</code></strong> 関数に読み込みたい画像のパスを渡すと、<br />
<strong>画像オブジェクト</strong> が返り値として戻ってくる。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> img; <span class="hljs-comment">// 画像オブジェクトを入れる変数（変数名は自由）</span>

<span class="hljs-keyword">function</span> <span class="hljs-title function_">preload</span>(<span class="hljs-params"></span>) {
  img = <span class="hljs-title function_">loadImage</span>(<span class="hljs-string">&#x27;画像ファイルへのパス&#x27;</span>);
}
</code></pre>
<p>注意点として、このような外部ファイルの読み込み処理は<br />
必ず <strong><code>preload()</code> 関数内で行う</strong>必要がある。</p>
<p><code>preload()</code> 関数は <code>setup()</code> 関数よりも先に実行される。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" lang="ja" data-marpit-pagination="36" style="--paginate:true;" data-marpit-pagination-total="72">
<p>読み込んだ画像オブジェクトを単純に表示するだけなら<br />
<strong><code>image()</code></strong> 関数を使えば良い。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-title function_">image</span>(img, <span class="hljs-number">10</span>, <span class="hljs-number">20</span>); <span class="hljs-comment">// img を 座標:(10, 20) に表示</span>
</code></pre>
<p>第 1 引数に表示したい画像オブジェクト,<br />
第 2, 第 3 引数は表示したい位置 (X, Y) を渡す。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" lang="ja" data-marpit-pagination="37" style="--paginate:true;" data-marpit-pagination-total="72">
<p><code>image()</code> 関数はさらに詳細な引数の指定が可能だ。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-title function_">image</span>(img,  x, y,  w, h,  dx, dy,  dw, dh);
</code></pre>
<table>
<thead>
<tr>
<th style="text-align:left">引数</th>
<th style="text-align:left">意味</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>x</code>, <code>y</code></td>
<td style="text-align:left">表示位置</td>
</tr>
<tr>
<td style="text-align:left"><code>w</code>, <code>h</code></td>
<td style="text-align:left">表示サイズ</td>
</tr>
<tr>
<td style="text-align:left"><code>dx</code>, <code>dy</code></td>
<td style="text-align:left">画像切り取り始点</td>
</tr>
<tr>
<td style="text-align:left"><code>dw</code>, <code>dh</code></td>
<td style="text-align:left">画像切り取り幅, 高さ</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" lang="ja" data-marpit-pagination="38" style="--paginate:true;" data-marpit-pagination-total="72">
<h3 id="%E3%82%B5%E3%83%B3%E3%83%97%E3%83%AB%E3%82%B3%E3%83%BC%E3%83%89">サンプルコード</h3>
<p><code>image()</code> 関数を使って簡単な <em>アニメーション</em> を実装してみたので、<br />
参考にしていただきたい。</p>
<p><code>05/WalkingKirby</code><br />
<a href="https://editor.p5js.org/amekusa/sketches/tUNf8Mhev">https://editor.p5js.org/amekusa/sketches/tUNf8Mhev</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" lang="ja" data-marpit-pagination="39" style="--paginate:true;" data-marpit-pagination-total="72">
<p>今度は画像をそのまま表示するのではなく、<br />
読み込んだ<strong>画像データを元に、複雑な処理</strong>を施してみよう。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" lang="ja" data-marpit-pagination="40" style="--paginate:true;" data-marpit-pagination-total="72" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;assets/pixels.png&quot;);filter:opacity(0.15);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="40" data-paginate="true" lang="ja" data-marpit-pagination="40" style="--paginate:true;" data-marpit-pagination-total="72" data-marpit-advanced-background="content">
<p>そもそも、画像データとはどのようなデータだろうか。</p>
<p>デジタルデータとしての画像とは、<br />
<strong>整列した画素（ピクセル）の集合</strong> にほかならない。<br />
そして、ピクセルとは <strong>RGB 値で表現される色</strong> のデータである。</p>
<p>つまり、デジタル画像とは <strong>色の集合</strong> なのだ。</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" lang="ja" data-marpit-pagination="40" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" lang="ja" data-marpit-pagination="41" style="--paginate:true;" data-marpit-pagination-total="72" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;assets/pixels.png&quot;);filter:opacity(0.15);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="41" data-paginate="true" lang="ja" data-marpit-pagination="41" style="--paginate:true;" data-marpit-pagination-total="72" data-marpit-advanced-background="content">
<p>プログラムにおいて <strong>集合<small>（複数のモノの集まり）</small></strong> を扱いたい場合は、<br />
<strong>配列</strong> を用いるのが手っ取り早い。</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" lang="ja" data-marpit-pagination="41" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" lang="ja" data-marpit-pagination="42" style="--paginate:true;" data-marpit-pagination-total="72">
<p><strong><code>loadImage()</code></strong> 関数から返ってくる画像オブジェクトも、<br />
内部の <strong>プロパティ</strong> に <strong>配列として色のデータ</strong> を保持している。</p>
<p>この配列にアクセスするには、まず <strong><code>img.loadPixels()</code></strong> 関数を呼んでから<br />
<strong><code>img.get()</code></strong> 関数を呼べばよい。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" lang="ja" data-marpit-pagination="43" style="--paginate:true;" data-marpit-pagination-total="72">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">img.<span class="hljs-title function_">loadPixels</span>();
<span class="hljs-keyword">let</span> c = img.<span class="hljs-title function_">get</span>(<span class="hljs-number">0</span>, <span class="hljs-number">0</span>); <span class="hljs-comment">// 位置(0, 0) の色を取得</span>
</code></pre>
<p><strong><code>img.get()</code></strong> 関数は <strong>画像上の指定された位置の色</strong> を取得し、<br />
オブジェクトとして返してくれる。(左上が 0, 0）</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" lang="ja" data-marpit-pagination="44" style="--paginate:true;" data-marpit-pagination-total="72">
<p>取得した <strong>色オブジェクト</strong> は<br />
<strong><code>fill()</code></strong> や <strong><code>stroke()</code></strong> などの関数に渡すことで<br />
<strong>描画色</strong> として利用することが可能だ。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">img.<span class="hljs-title function_">loadPixels</span>();
<span class="hljs-keyword">let</span> c = img.<span class="hljs-title function_">get</span>(<span class="hljs-number">0</span>, <span class="hljs-number">0</span>);

<span class="hljs-title function_">fill</span>(c); <span class="hljs-comment">// 塗りの色を c の値に設定</span>
<span class="hljs-title function_">circle</span>(mouseX, mouseY, <span class="hljs-number">10</span>); <span class="hljs-comment">// 円描画</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" lang="ja" data-marpit-pagination="45" style="--paginate:true;" data-marpit-pagination-total="72">
<p>サンプルコードを見てみよう。</p>
<p><code>05/ColorPicker/sketch.js</code><br />
<a href="https://editor.p5js.org/amekusa/sketches/-iyVpSKwJ">https://editor.p5js.org/amekusa/sketches/-iyVpSKwJ</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" lang="ja" data-marpit-pagination="46" style="--paginate:true;" data-marpit-pagination-total="72">
<p>画像の <em>幅と高さ</em> が知りたい場合は、<br />
<strong><code>img.width</code></strong> と <strong><code>img.height</code></strong> プロパティで取得できる。</p>
<p>これらを <code>for</code> 文と組み合わせると、<strong>画像全体をピクセル単位で精査<small>（スキャン）</small></strong> し、<br />
その情報を元に一風変わったエフェクトで画像を表示することができる。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" lang="ja" data-marpit-pagination="47" style="--paginate:true;" data-marpit-pagination-total="72">
<p>参考として、8x8 の小さな画像を <code>for</code> 文でスキャンし、<br />
<strong>各ピクセルを円に置き換えて描画する</strong> スケッチを用意した。</p>
<p><code>05/PixelKirby/sketch.js</code><br />
<a href="https://editor.p5js.org/amekusa/sketches/1_XSnQ1iC">https://editor.p5js.org/amekusa/sketches/1_XSnQ1iC</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" lang="ja" data-marpit-pagination="48" style="--paginate:true;" data-marpit-pagination-total="72">
<p><code>for</code> 文と配列, オブジェクトを活用したサンプルコードも用意した。<br />
<strong>各ピクセルをオブジェクトに変換</strong>している点に注目してもらいたい。</p>
<p>二つめのサンプルは、それらオブジェクトに<strong>独立した挙動</strong>を持たせ、<br />
<em>群体アニメーション</em> のような動きを実現している。</p>
<p><code>05/Pic-Cells/sketch.js</code><br />
<a href="https://editor.p5js.org/amekusa/sketches/0XDQSWwub">https://editor.p5js.org/amekusa/sketches/0XDQSWwub</a></p>
<p><code>05/Pic-Cells2/sketch.js</code><br />
<a href="https://editor.p5js.org/amekusa/sketches/AbSwnPIGp">https://editor.p5js.org/amekusa/sketches/AbSwnPIGp</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" lang="ja" data-marpit-pagination="49" style="--paginate:true;" data-marpit-pagination-total="72">
<h2 id="%E3%82%B5%E3%82%A6%E3%83%B3%E3%83%89%E3%83%A9%E3%82%A4%E3%83%96%E3%83%A9%E3%83%AA%E3%82%92%E4%BD%BF%E3%81%8A%E3%81%86">サウンドライブラリを使おう</h2>
<p>波形を解析してビジュアライザを作ってみよう</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" lang="ja" data-marpit-pagination="50" style="--paginate:true;" data-marpit-pagination-total="72">
<p>p5.js は <strong>サウンド</strong> を扱うことも可能だ。<br />
まずはサウンドファイルを読み込んで再生してみよう。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> snd; <span class="hljs-comment">// サウンドオブジェクトを入れる変数（変数名は自由）</span>

<span class="hljs-keyword">function</span> <span class="hljs-title function_">preload</span>(<span class="hljs-params"></span>) {
  snd = <span class="hljs-title function_">loadSound</span>(<span class="hljs-string">&#x27;サウンドファイル&#x27;</span>);
}
</code></pre>
<p>画像を読み込む際と流れは同じだが、<br />
<code>loadImage()</code> の替わりに、<strong><code>loadSound()</code></strong> 関数使う。</p>
<p>ファイル形式は <strong><code>.mp3</code> を使うのが無難</strong> だろう。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" lang="ja" data-marpit-pagination="51" style="--paginate:true;" data-marpit-pagination-total="72">
<p>読み込んだサウンドオブジェクトを再生するには<br />
<strong><code>snd.play()</code></strong> 関数を呼べばいい。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">setup</span>(<span class="hljs-params"></span>) {
  <span class="hljs-title function_">createCanvas</span>(<span class="hljs-number">400</span>, <span class="hljs-number">400</span>);

  <span class="hljs-comment">// サウンド再生</span>
  snd.<span class="hljs-title function_">play</span>();
}
</code></pre>
<p>再生をやめるには <strong><code>snd.stop()</code></strong> 、<br />
一時停止は <strong><code>snd.pause()</code></strong> 関数だ。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" lang="ja" data-marpit-pagination="52" style="--paginate:true;" data-marpit-pagination-total="72">
<p><code>snd.play()</code> 関数は、<br />
引数を与えることで <em>再生速度</em> や <em>音量</em> などを変えることもできる。</p>
<p>例:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">snd.<span class="hljs-title function_">play</span>(
  <span class="hljs-number">0</span>,  <span class="hljs-comment">// 再生までのディレイ（秒）</span>
  <span class="hljs-number">1</span>,  <span class="hljs-comment">// 再生速度</span>
  <span class="hljs-number">1</span>,  <span class="hljs-comment">// 音量</span>
  <span class="hljs-number">0</span>,  <span class="hljs-comment">// 再生開始時間（秒）</span>
  <span class="hljs-number">2</span>   <span class="hljs-comment">// 再生時間（秒）</span>
);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" lang="ja" data-marpit-pagination="53" style="--paginate:true;" data-marpit-pagination-total="72">
<p>身の回りの環境音を録音して、<em>効果音</em> として使ってみるのもよいだろう。</p>
<h3 id="%E3%82%B5%E3%83%B3%E3%83%97%E3%83%AB%E3%82%B3%E3%83%BC%E3%83%89-1">サンプルコード</h3>
<p>sound-effect<br />
<a href="https://editor.p5js.org/amekusa/sketches/76cypcHJd">https://editor.p5js.org/amekusa/sketches/76cypcHJd</a></p>
<p><code>05/King-Kong-Kung/sketch.js</code><br />
<a href="https://editor.p5js.org/amekusa/sketches/ZzGm48DHc">https://editor.p5js.org/amekusa/sketches/ZzGm48DHc</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" lang="ja" data-marpit-pagination="54" style="--paginate:true;" data-marpit-pagination-total="72">
<h2 id="%E3%82%B5%E3%82%A6%E3%83%B3%E3%83%89%E6%B3%A2%E5%BD%A2%E3%82%92%E8%A7%A3%E6%9E%90%E3%81%99%E3%82%8B">サウンド波形を解析する</h2>
<p>ただ再生するだけではなく、<br />
<strong>再生中のサウンドに反応</strong> して見た目が変化するようなスケッチを書いてみよう。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" lang="ja" data-marpit-pagination="55" style="--paginate:true;" data-marpit-pagination-total="72" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;assets/waves.png&quot;);filter:opacity(0.3);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="55" data-paginate="true" lang="ja" data-marpit-pagination="55" style="--paginate:true;" data-marpit-pagination-total="72" data-marpit-advanced-background="content">
<h3 id="%E9%9F%B3">音</h3>
<p>我々が音を認識できるのは、<br />
音の発生源の <strong>振動</strong> が周囲の <strong>空気に波</strong> を作り、<br />
その波が耳の奥の <strong>鼓膜を振動</strong> させるからだ。</p>
<p>また、その <strong>振動の速さやリズム, 大きさ等</strong> によって<br />
様々な種類の音を識別することができる。</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" lang="ja" data-marpit-pagination="55" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" lang="ja" data-marpit-pagination="56" style="--paginate:true;" data-marpit-pagination-total="72" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;assets/waves.png&quot;);filter:opacity(0.3);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="56" data-paginate="true" lang="ja" data-marpit-pagination="56" style="--paginate:true;" data-marpit-pagination-total="72" data-marpit-advanced-background="content">
<p>様々な振動のパターンが描く <strong>波の形</strong> を記録したのがサウンドファイルだ。<br />
我々はその波形を数学的に <strong>解析</strong> することで、<br />
その音に記録された <strong>あらゆる詳細な情報</strong> を取得することができる。</p>
<p>その情報を <strong>プログラムの動作にフィードバック</strong> させれば、<br />
<strong>音と一体となった</strong> 面白いインタラクティブアートが創出できるかもしれない。</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" lang="ja" data-marpit-pagination="56" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" lang="ja" data-marpit-pagination="57" style="--paginate:true;" data-marpit-pagination-total="72">
<h4 id="%E9%9F%B3%E5%9C%A7%E3%82%92%E5%8F%96%E5%BE%97%E3%81%99%E3%82%8B">音圧を取得する</h4>
<p><code>05/MusicPlayer/sketch.js</code><br />
<a href="https://editor.p5js.org/amekusa/sketches/-5YQoKdUJ">https://editor.p5js.org/amekusa/sketches/-5YQoKdUJ</a></p>
<h4 id="%E5%AE%9A%E4%BD%8D%E3%81%AE%E7%A7%BB%E5%8B%95-%E6%B3%A2%E5%BD%A2%E3%81%AE%E8%A1%A8%E7%A4%BA">定位の移動, 波形の表示</h4>
<p><code>05/MusicPlayer2/sketch.js</code><br />
<a href="https://editor.p5js.org/amekusa/sketches/uCmyFkJ8F">https://editor.p5js.org/amekusa/sketches/uCmyFkJ8F</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" lang="ja" data-marpit-pagination="58" style="--paginate:true;" data-marpit-pagination-total="72">
<h2 id="%E3%83%9E%E3%82%A4%E3%82%AF%E5%85%A5%E5%8A%9B%E3%82%92%E5%8F%96%E5%BE%97%E3%81%99%E3%82%8B">マイク入力を取得する</h2>
<p>PC のマイク入力を取得するには、まず以下のような手順が必要となる。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> mic;

<span class="hljs-keyword">function</span> <span class="hljs-title function_">setup</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">let</span> canvas = <span class="hljs-title function_">createCanvas</span>(<span class="hljs-number">400</span>, <span class="hljs-number">400</span>);
  <span class="hljs-comment">// クリックしたらマイク使用許可</span>
  canvas.<span class="hljs-title function_">mousePressed</span>(userStartAudio);
  <span class="hljs-comment">// マイクオブジェクトを生成, 変数に格納</span>
  mic = <span class="hljs-keyword">new</span> p5.<span class="hljs-title class_">AudioIn</span>();
  <span class="hljs-comment">// マイク起動</span>
  mic.<span class="hljs-title function_">start</span>();
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" lang="ja" data-marpit-pagination="59" style="--paginate:true;" data-marpit-pagination-total="72">
<p>あとは <code>mic.getLevel()</code> 関数でマイクの現在の <strong>入力レベル</strong> が取得できる。<br />
入力レベルは <code>0.0</code> から <code>1.0</code> までの数値だ。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">draw</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">let</span> level = mic.<span class="hljs-title function_">getLevel</span>();
}
</code></pre>
<p>これを利用し、<br />
<strong>環境音に反応して何かが起こる</strong> スケッチを描いてみてはいかがだろうか。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" lang="ja" data-marpit-pagination="60" style="--paginate:true;" data-marpit-pagination-total="72">
<p>サンプル: Laughing Wave<br />
<a href="https://editor.p5js.org/amekusa/sketches/tKPJc8sBx">https://editor.p5js.org/amekusa/sketches/tKPJc8sBx</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" lang="ja" data-marpit-pagination="61" style="--paginate:true;" data-marpit-pagination-total="72">
<p>サウンドのプログラミングは奥が深く、当講義で全てを網羅することはできない。<br />
しかし、当講義で紹介した方法だけでも<strong>アイディア次第</strong>で多くの可能性を見出せるはず。</p>
<p>興味が湧いたのなら、<br />
p5.js のサウンドライブラリのリファレンスに目を通すことをお勧めする。<br />
<a href="https://p5js.org/reference/#/libraries/p5.sound">https://p5js.org/reference/#/libraries/p5.sound</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" lang="ja" data-marpit-pagination="62" style="--paginate:true;" data-marpit-pagination-total="72">
<h2 id="%E3%82%BF%E3%82%A4%E3%83%9D%E3%82%B0%E3%83%A9%E3%83%95%E3%82%A3">タイポグラフィ</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" lang="ja" data-marpit-pagination="63" style="--paginate:true;" data-marpit-pagination-total="72">
<p>p5.js はフォントを扱うこともできる。<br />
フォントファイルを読み込むには <strong><code>loadFont()</code></strong> 関数を使えばよい。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> font; <span class="hljs-comment">// フォントオブジェクトを入れる変数</span>

<span class="hljs-keyword">function</span> <span class="hljs-title function_">preload</span>(<span class="hljs-params"></span>) {
    font = <span class="hljs-title function_">loadFont</span>(<span class="hljs-string">&#x27;フォントファイル&#x27;</span>);
}
</code></pre>
<p>対応しているフォントのファイル形式は <strong><code>.ttf</code> か <code>.otf</code></strong> のみだ。</p>
<p>まずはライセンスフリーのフォントで使いたいものを探してみよう。<br />
<a href="https://www.fontsquirrel.com/">https://www.fontsquirrel.com/</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" lang="ja" data-marpit-pagination="64" style="--paginate:true;" data-marpit-pagination-total="72">
<p>読み込んだフォントオブジェクトを使用するには <strong><code>textFont()</code></strong> 関数を呼ぼう。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-title function_">textFont</span>(font);
<span class="hljs-title function_">text</span>(<span class="hljs-string">&#x27;Hello p5.js !&#x27;</span>);
</code></pre>
<p><code>textFont()</code> 関数の引数にフォントオブジェクトを渡し、<br />
<strong><code>text()</code></strong> 関数で任意の文字列を描画する。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" lang="ja" data-marpit-pagination="65" style="--paginate:true;" data-marpit-pagination-total="72">
<p>フォントオブジェクトの <strong><code>textToPoints()</code></strong> 関数は<br />
<strong>テキストのアウトラインデータ</strong> を取得する関数だ。<br />
アウトラインデータは <strong>全ての頂点の位置</strong> を示した <strong>配列</strong> だ。<br />
使い方についてはサンプルコードを参照していただきたい。</p>
<p><code>05/Typography/sketch.js</code><br />
<a href="https://editor.p5js.org/amekusa/sketches/XcKPoUYOH">https://editor.p5js.org/amekusa/sketches/XcKPoUYOH</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" lang="ja" data-marpit-pagination="66" style="--paginate:true;" data-marpit-pagination-total="72">
<h4 id="%E3%82%B5%E3%83%B3%E3%83%97%E3%83%AB%E9%9B%86-by-%E8%AC%9B%E5%B8%AB%E7%9B%B8%E9%A6%AC">サンプル集 by 講師:相馬</h4>
<p><a href="https://editor.p5js.org/amekusa/collections/9jwIe3hqu">https://editor.p5js.org/amekusa/collections/9jwIe3hqu</a></p>
<h4 id="%E5%8F%82%E8%80%83%E6%9B%B8%E7%B1%8D%E3%81%AE%E3%82%B3%E3%83%BC%E3%83%89">参考書籍のコード</h4>
<p><a href="http://www.bnn.co.jp/support/generativedesign_p5js/">http://www.bnn.co.jp/support/generativedesign_p5js/</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" lang="ja" data-marpit-pagination="67" style="--paginate:true;" data-marpit-pagination-total="72">
<h1 id="appendix-%E4%BE%BF%E5%88%A9%E3%81%AA%E9%96%A2%E6%95%B0">Appendix: 便利な関数</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" lang="ja" data-marpit-pagination="68" style="--paginate:true;" data-marpit-pagination-total="72">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-title function_">map</span>(value,   start1, stop1,   start2, stop2);
</code></pre>
<p><code>start1</code> ~ <code>stop1</code> の値の範囲内にある <code>value</code> の値を、<br />
<code>start2</code> ~ <code>stop2</code> の値の範囲内に収まるよう変換する。</p>
<p>例:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> v = <span class="hljs-title function_">map</span>(<span class="hljs-number">3</span>,   <span class="hljs-number">0</span>, <span class="hljs-number">10</span>,   <span class="hljs-number">0</span>, <span class="hljs-number">100</span>); <span class="hljs-comment">// 変数 v には 30 が入る</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> v = <span class="hljs-title function_">map</span>(<span class="hljs-number">0.5</span>,   <span class="hljs-number">0</span>, <span class="hljs-number">1</span>,   <span class="hljs-number">50</span>, <span class="hljs-number">100</span>); <span class="hljs-comment">// 変数 v には 75 が入る</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" lang="ja" data-marpit-pagination="69" style="--paginate:true;" data-marpit-pagination-total="72">
<p>例えば、<code>mic.getLevel()</code> で取得できる値は <code>0.0 ~ 1.0</code> だが、<br />
<code>map()</code> を使って、この値を <code>0 ~ 255</code> の値に変換することができる。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// 0 から 1</span>
<span class="hljs-keyword">let</span> level = mic.<span class="hljs-title function_">getLevel</span>();

<span class="hljs-comment">// 0 から 255 に変換</span>
<span class="hljs-keyword">let</span> bg = <span class="hljs-title function_">map</span>(level,   <span class="hljs-number">0</span>, <span class="hljs-number">1</span>,   <span class="hljs-number">0</span>, <span class="hljs-number">255</span>);

<span class="hljs-comment">// マイクレベルに応じて背景が黒から白に変動する</span>
<span class="hljs-title function_">background</span>(bg);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" lang="ja" data-marpit-pagination="70" style="--paginate:true;" data-marpit-pagination-total="72">
<h1 id="appendix-%E7%9C%81%E7%95%A5%E8%A8%98%E6%B3%95">Appendix: 省略記法</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" lang="ja" data-marpit-pagination="71" style="--paginate:true;" data-marpit-pagination-total="72">
<p>変数 <code>x</code> の値を <code>1</code> 増やすには、</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">x = x + <span class="hljs-number">1</span>;
</code></pre>
<p>...と書くが、これは、</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">x++;
</code></pre>
<p>...と書いても同じである。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" lang="ja" data-marpit-pagination="72" style="--paginate:true;" data-marpit-pagination-total="72">
<p>変数 <code>x</code> の値を <code>y</code> 増やすには、</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">x = x + y;
</code></pre>
<p>...と書くが、これは、</p>
